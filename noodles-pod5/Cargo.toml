[package]
name = "noodles-pod5"
version = "0.1.0"
authors = ["Selik Wilhelm-Landry <selik.wilhelm.landry@gmail.com>"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "POD5 format Reader and Writer"
homepage = "https://github.com/zaeleus/noodles"
repository = "https://github.com/zaeleus/noodles"
documentation = "https://docs.rs/noodles-pod5"
categories = ["parser-implementations", "science::bioinformatics"]

[dependencies]
arc-swap = "1.9.2"
arrow = "59.0.0"
flatbuffers = "25.12.19"
memmap2 = "0.9.11"
ruzstd = "0.9.0"

[features]
default = ["simd-auto"]
backend = []
simd-auto = []
simd-avx2 = []
simd-ssse3 = []
simd-neon = []

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[dev-dependencies]

[lints]
workspace = true

[package.metadata.docs.rs]